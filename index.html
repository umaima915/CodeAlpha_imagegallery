<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery | Categories & Lightbox</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #ead066 0%, #a2824b 100%);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .gallery-wrapper {
      max-width: 1400px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 2rem;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .gallery-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .gallery-header h1 {
      font-size: 2.5rem;
      color: #333;
      margin-bottom: 0.5rem;
    }

    .gallery-header p {
      color: #666;
      font-size: 1.1rem;
    }

    /* Controls Section */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      padding: 1rem;
      background: #f8f9fa;
      border-radius: 1rem;
    }

    /* Category Filters */
    .categories {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .category-btn {
      padding: 0.6rem 1.5rem;
      border: 2px solid #eac566;
      background: white;
      color: #eab166;
      border-radius: 2rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .category-btn:hover {
      background: #ead666;
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(234, 210, 102, 0.4);
    }

    .category-btn.active {
      background:  #eac566;
      color: white;
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    /* Navigation Buttons */
    .nav-controls {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .nav-btn {
      width: 45px;
      height: 45px;
      border: none;
      background: #eaba66;
      color: white;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:hover {
      background: #a2934b;
      transform: scale(1.1);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    .nav-btn:active {
      transform: scale(0.95);
    }

    .image-counter {
      font-size: 0.9rem;
      color: #666;
      min-width: 60px;
      text-align: center;
    }

    /* Gallery Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .gallery-item {
      position: relative;
      border-radius: 1rem;
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 1;
      background: #e0e0e0;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      border: 3px solid transparent;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .gallery-item:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.1);
    }
    /* Active border when navigating with counter */
    .gallery-item.active-nav {
      border: 4px solid  #eac566;
      box-shadow: 0 0 20px rgba(102, 126, 234, 0.6);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 20px rgba(102, 126, 234, 0.6);
      }
      50% {
        box-shadow: 0 0 30px rgba(102, 126, 234, 0.9);
      }
    }
    /* Overlay on hover */
    .item-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      color: white;
      padding: 1.5rem 1rem 1rem;
      transform: translateY(100%);
      transition: transform 0.3s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .gallery-item:hover .item-overlay {
      transform: translateY(0);
    }

    .item-title {
      font-weight: 600;
      font-size: 1rem;
    }

    .item-category {
      background: #667eea;
      padding: 0.3rem 0.8rem;
      border-radius: 1rem;
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    .view-btn {
      background: white;
      color: #333;
      border: none;
      padding: 0.3rem 0.8rem;
      border-radius: 1rem;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .view-btn:hover {
      background: #667eea;
      color: white;
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.3s ease;
    }

    .lightbox.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .lightbox-content {
      position: relative;
      max-width: 90%;
      max-height: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lightbox-image {
      max-width: 100%;
      max-height: 80vh;
      border-radius: 1rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .lightbox-info {
      color: white;
      text-align: center;
      margin-top: 1rem;
    }

    .lightbox-title {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .lightbox-category {
      background: #667eea;
      padding: 0.3rem 1rem;
      border-radius: 1rem;
      display: inline-block;
    }

    .close-lightbox {
      position: absolute;
      top: -40px;
      right: 0;
      background: none;
      border: none;
      color: white;
      font-size: 2rem;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .close-lightbox:hover {
      transform: scale(1.2);
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      font-size: 2rem;
      padding: 1rem;
      cursor: pointer;
      border-radius: 0.5rem;
      transition: all 0.3s ease;
    }

    .lightbox-nav:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    .lightbox-prev {
      left: -60px;
    }

    .lightbox-next {
      right: -60px;
    }

    /* Loading animation */
    .loading {
      display: none;
      text-align: center;
      padding: 2rem;
    }

    .loading-spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .gallery-wrapper {
        padding: 1rem;
      }

      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 1rem;
      }

      .controls {
        flex-direction: column;
        align-items: stretch;
      }

      .lightbox-prev {
        left: 10px;
      }

      .lightbox-next {
        right: 10px;
      }

      .gallery-header h1 {
        font-size: 1.8rem;
      }
    }

    @media (max-width: 480px) {
      .gallery-grid {
        grid-template-columns: 1fr 1fr;
        gap: 0.8rem;
      }

      .category-btn {
        padding: 0.5rem 1rem;
        font-size: 0.8rem;
      }
    }

    /* Hidden items for filtering */
    .gallery-item.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="gallery-wrapper">
    <div class="gallery-header">
      <h1>📸 Image Gallery</h1>
      <p>Explore our collection • Click to view</p>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="categories" id="categoriesContainer">
        <!-- Categories will be inserted by JS -->
      </div>
      
      <div class="nav-controls">
        <button class="nav-btn" id="prevBtn" title="Previous">◀</button>
        <span class="image-counter" id="imageCounter">1 / 12</span>
        <button class="nav-btn" id="nextBtn" title="Next">▶</button>
      </div>
    </div>

    <!-- Gallery Grid -->
    <div class="gallery-grid" id="galleryGrid">
      <!-- Gallery items will be inserted by JS -->
    </div>

    <!-- Loading -->
    <div class="loading" id="loading">
      <div class="loading-spinner"></div>
      <p>Loading images...</p>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-content">
      <button class="close-lightbox" id="closeLightbox">✕</button>
      <button class="lightbox-nav lightbox-prev" id="lightboxPrev">◀</button>
      <img class="lightbox-image" id="lightboxImage" src="" alt="">
      <button class="lightbox-nav lightbox-next" id="lightboxNext">▶</button>
      <div class="lightbox-info">
        <div class="lightbox-title" id="lightboxTitle"></div>
        <span class="lightbox-category" id="lightboxCategory"></span>
      </div>
    </div>
  </div>

  <script>
    // Image Data
    const imageData = [
      { id: 1, src: 'https://picsum.photos/seed/nature1/600/600', title: 'Mountain Sunrise', category: 'nature' },
      { id: 2, src: 'https://picsum.photos/seed/nature2/600/600', title: 'Forest Path', category: 'nature' },
      { id: 3, src: 'https://picsum.photos/seed/nature3/600/600', title: 'Ocean Waves', category: 'nature' },
      { id: 4, src: 'https://picsum.photos/seed/city1/600/600', title: 'City Skyline', category: 'urban' },
      { id: 5, src: 'https://picsum.photos/seed/city2/600/600', title: 'Night Lights', category: 'urban' },
      { id: 6, src: 'https://picsum.photos/seed/city3/600/600', title: 'Street Art', category: 'urban' },
      { id: 7, src: 'https://picsum.photos/seed/portrait1/600/600', title: 'Portrait One', category: 'portrait' },
      { id: 8, src: 'https://picsum.photos/seed/portrait2/600/600', title: 'Portrait Two', category: 'portrait' },
      { id: 9, src: 'https://picsum.photos/seed/portrait3/600/600', title: 'Portrait Three', category: 'portrait' },
      { id: 10, src: 'https://picsum.photos/seed/abstract1/600/600', title: 'Colors', category: 'abstract' },
      { id: 11, src: 'https://picsum.photos/seed/abstract2/600/600', title: 'Patterns', category: 'abstract' },
      { id: 12, src: 'https://picsum.photos/seed/abstract3/600/600', title: 'Geometric', category: 'abstract' },
    ];

    // State
    let currentCategory = 'all';
    let currentIndex = 0;
    let filteredImages = [...imageData];
    let lightboxOpen = false;
    let lightboxIndex = 0;

    // DOM Elements
    const galleryGrid = document.getElementById('galleryGrid');
    const categoriesContainer = document.getElementById('categoriesContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const imageCounter = document.getElementById('imageCounter');
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');
    const lightboxTitle = document.getElementById('lightboxTitle');
    const lightboxCategory = document.getElementById('lightboxCategory');
    const closeLightbox = document.getElementById('closeLightbox');
    const lightboxPrev = document.getElementById('lightboxPrev');
    const lightboxNext = document.getElementById('lightboxNext');
    const loading = document.getElementById('loading');

    // Get unique categories
    const categories = ['all', ...new Set(imageData.map(img => img.category))];

    // Initialize categories
    function initCategories() {
      categoriesContainer.innerHTML = categories.map(cat => 
        `<button class="category-btn ${cat === currentCategory ? 'active' : ''}" data-category="${cat}">
          ${cat.charAt(0).toUpperCase() + cat.slice(1)}
        </button>`
      ).join('');

      // Add event listeners
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const category = e.target.dataset.category;
          filterByCategory(category);
        });
      });
    }

    // Filter by category
    function filterByCategory(category) {
      currentCategory = category;
      
      // Update active button
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.category === category);
      });

      // Filter images
      filteredImages = category === 'all' 
        ? [...imageData] 
        : imageData.filter(img => img.category === category);
      
      currentIndex = 0;
      renderGallery();
    }

    // Render gallery
    function renderGallery() {
      // Show loading
      loading.style.display = 'block';
      galleryGrid.innerHTML = '';

      setTimeout(() => {
        galleryGrid.innerHTML = filteredImages.map((img, index) => `
          <div class="gallery-item" data-index="${index}">
            <img src="${img.src}" alt="${img.title}" loading="lazy">
            <div class="item-overlay">
              <span class="item-title">${img.title}</span>
              <div>
                <span class="item-category">${img.category}</span>
                <button class="view-btn" onclick="event.stopPropagation(); openLightbox(${index})">🔍</button>
              </div>
            </div>
          </div>
        `).join('');

        // Add click listeners to gallery items
        document.querySelectorAll('.gallery-item').forEach(item => {
          item.addEventListener('click', (e) => {
            if (!e.target.classList.contains('view-btn')) {
              const index = parseInt(item.dataset.index);
              openLightbox(index);
            }
          });
        });

        loading.style.display = 'none';
        updateCounter();
        highlightActiveImage();
      }, 300);
    }
    // Highlight active image with border
    function highlightActiveImage() {
      // Remove active class from all items
      document.querySelectorAll('.gallery-item').forEach(item => {
        item.classList.remove('active-nav');
      });
      
      // Add active class to current index
      const items = document.querySelectorAll('.gallery-item');
      if (items[currentIndex]) {
        items[currentIndex].classList.add('active-nav');
      }
    }
    // Navigate through gallery
    function navigateGallery(direction) {
      if (filteredImages.length === 0) return;
      
      if (direction === 'prev') {
        currentIndex = currentIndex > 0 ? currentIndex - 1 : filteredImages.length - 1;
      } else {
        currentIndex = currentIndex < filteredImages.length - 1 ? currentIndex + 1 : 0;
      }
      
      updateCounter();
      highlightActiveImage();
      
      // Scroll to the current image
      const items = document.querySelectorAll('.gallery-item');
      if (items[currentIndex]) {
        items[currentIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }
    // Update image counter
    function updateCounter() {
      const total = filteredImages.length;
      imageCounter.textContent = total > 0 ? `${currentIndex + 1} / ${total}` : '0 / 0';
    }

    

    // Open lightbox
    function openLightbox(index) {
      lightboxIndex = index;
      const image = filteredImages[lightboxIndex];
      
      lightboxImage.src = image.src;
      lightboxTitle.textContent = image.title;
      lightboxCategory.textContent = image.category;
      
      lightbox.classList.add('active');
      lightboxOpen = true;
      
      // Disable body scroll
      document.body.style.overflow = 'hidden';
    }

    // Close lightbox
    function closeLightboxFunc() {
      lightbox.classList.remove('active');
      lightboxOpen = false;
      
      // Enable body scroll
      document.body.style.overflow = 'auto';
    }

    // Navigate lightbox
    function navigateLightbox(direction) {
      if (filteredImages.length === 0) return;
      
      if (direction === 'prev') {
        lightboxIndex = lightboxIndex > 0 ? lightboxIndex - 1 : filteredImages.length - 1;
      } else {
        lightboxIndex = lightboxIndex < filteredImages.length - 1 ? lightboxIndex + 1 : 0;
      }
      
      const image = filteredImages[lightboxIndex];
      lightboxImage.src = image.src;
      lightboxTitle.textContent = image.title;
      lightboxCategory.textContent = image.category;
    }

    // Event Listeners
    prevBtn.addEventListener('click', () => navigateGallery('prev'));
    nextBtn.addEventListener('click', () => navigateGallery('next'));
    
    closeLightbox.addEventListener('click', closeLightboxFunc);
    lightboxPrev.addEventListener('click', () => navigateLightbox('prev'));
    lightboxNext.addEventListener('click', () => navigateLightbox('next'));
    
    // Close lightbox on background click
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) {
        closeLightboxFunc();
      }
    });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (lightboxOpen) {
        if (e.key === 'ArrowLeft') navigateLightbox('prev');
        if (e.key === 'ArrowRight') navigateLightbox('next');
        if (e.key === 'Escape') closeLightboxFunc();
      } else {
        if (e.key === 'ArrowLeft') navigateGallery('prev');
        if (e.key === 'ArrowRight') navigateGallery('next');
      }
    });

    // Initialize
    initCategories();
    renderGallery();
  </script>
</body>
</html>
